# Flutter + Flame, targeting Android.
#
# A profile tells the DevOps role what "build" and "test" mean for a stack, so it
# never has to guess. Adding a profile is the easiest useful contribution to this
# project — it is data, not code.
name: flutter-android
description: Flutter application built for Android, optionally with the Flame game engine.

requires:
  - flutter
  - dart
  - java
  - adb

commands:
  install: flutter pub get
  lint: flutter analyze
  test: flutter test --reporter=json
  build: flutter build apk --debug
  # Longhaul reads the count, not the exit code.
  test_count: "flutter test --reporter=json | grep -c '\"type\":\"testDone\"'"

artifacts:
  apk: build/app/outputs/flutter-apk/app-debug.apk

proof:
  kind: emulator_screenshot
  # Install, launch, let it settle, grab a frame. The screenshot is then checked
  # against the day's acceptance criteria and the design system.
  timeout_s: 180
  # A precondition, not a step. `adb` being installed with no device attached
  # means this machine cannot demonstrate anything — which is reported as
  # could-not-run, not as a failed day. Failing here would burn a retry budget
  # on every developer machine without an emulator running.
  #
  # `adb get-state` and NOT `adb wait-for-device`: wait-for-device blocks forever
  # when nothing is attached, which is the wrong primitive for a gate that must
  # never hang. It hung this project's own test suite once.
  requires:
    - adb get-state
  steps:
    - adb install -r {artifacts.apk}
    - adb shell monkey -p {package} -c android.intent.category.LAUNCHER 1
    - sleep 5
    - adb exec-out screencap -p > {proof_dir}/screenshot.png

gates:
  coverage_ratchet: true
  test_count_ratchet: true
  cheat: true
  secrets: true

# Generated by `longhaul plan --target target.md --days 14 --profile flutter-android`
# on 2026-08-30, in one Planner call costing $0.72. Committed unedited, as the
# reference for what a real plan looks like.
project: Neon Drift
target_days: 14
profile: flutter-android
milestones:
- id: m1
  title: 'Ground: build, CI, and the constraints that must never be violated'
  days:
  - 1
  - 2
  tasks:
  - id: t1
    day: 1
    kind: infra
    title: Flutter scaffold, Android package identity, and a CI pipeline that ships
      a debug APK
    acceptance_criteria:
    - '`flutter analyze` exits 0 and `flutter test --reporter=json` reports at least
      one passing test that fails when its expected value is negated'
    - '`flutter build apk --debug` succeeds and CI attaches the resulting APK as a
      downloadable artifact on every push to every branch'
    - The installed app's package name is `com.cybiqon.neondrift` (verified by `adb
      shell pm list packages | grep neondrift`)
    - '`android/app/src/main/AndroidManifest.xml` declares no INTERNET permission,
      and `pubspec.yaml` lists no ads, analytics, or HTTP package'
    depends_on: []
    surfaces:
    - ci
    - android
    - app
    estimate_minutes: 75
    risk: low
    needs_human: false
    proof:
      kind: emulator_screenshot
      expect: An emulator running the app installed from the CI artifact APK, showing
        the placeholder home screen with the title 'Neon Drift', beside the Android
        app-info panel showing package name com.cybiqon.neondrift.
  - id: t2
    day: 1
    kind: infra
    title: CI guard that keeps lib/engine/ free of Flutter and Flame
    acceptance_criteria:
    - '`dart run tool/check_engine_purity.dart` exits 0 on the current tree and exits
      non-zero when any file under `lib/engine/` imports `package:flutter`, `package:flame`,
      or `dart:ui`'
    - A test in `test/` asserts the guard rejects a fixture file containing a forbidden
      import, so the guard itself cannot silently stop working
    - The guard runs as a required CI step on every push, and a push containing a
      forbidden import turns the CI run red
    - '`lib/engine/` exists and is reachable from a `dart run` entrypoint that does
      not depend on the Flutter SDK'
    depends_on:
    - t1
    surfaces:
    - ci
    - engine
    estimate_minutes: 40
    risk: low
    needs_human: false
    proof:
      kind: command_output
      expect: 'Two CI run logs side by side: one green with ''engine purity: OK'',
        one red on a branch where a Flutter import was added to lib/engine/, naming
        the offending file and line.'
  - id: t3
    day: 2
    kind: design
    title: 'Design system: palette options, type scale, spacing, motion, tone'
    acceptance_criteria:
    - '`docs/design-system.md` records three named palette options with hex values,
      the type scale, the spacing scale, motion durations/curves, and the copy tone,
      and states explicitly that the final palette is the author''s pick'
    - Tokens live in one file and every colour, text size, spacing value, and animation
      duration used by later UI comes from it — no raw hex or magic numbers elsewhere
      in `lib/ui/`
    - A debug-only token gallery route renders all three palettes, the full type scale,
      and the spacing scale, switchable at runtime, so the author can compare options
      on a device
    - One palette is marked PROVISIONAL in the tokens file so UI work is unblocked,
      and swapping the active palette is a one-line change
    depends_on:
    - t1
    surfaces:
    - ui
    - docs
    estimate_minutes: 80
    risk: medium
    needs_human: true
    proof:
      kind: emulator_screenshot
      expect: Three emulator screenshots of the token gallery, one per palette option,
        each showing swatches with hex labels, the type scale specimen, and the spacing
        ruler — visibly different from each other and legible on a dark background.
  - id: t4
    day: 2
    kind: docs
    title: 'Runtime dependency proposal: settings persistence and audio'
    acceptance_criteria:
    - '`docs/decisions/dependencies.md` lists every capability the target requires
      that Flutter + Flame alone do not cover (settings persistence, audio playback),
      with at least two options each, their cost, and a recommendation'
    - For each capability the document names a zero-new-dependency fallback that can
      be built without the author's answer
    - The document states which day each decision blocks (day 9), so an unanswered
      question is visible before it costs time
    - '`pubspec.yaml` still declares no dependency beyond flutter, flame, and dev/lint
      packages at the end of the day'
    depends_on:
    - t1
    surfaces:
    - docs
    estimate_minutes: 30
    risk: low
    needs_human: true
    proof:
      kind: document
      expect: docs/decisions/dependencies.md rendered, showing a two-capability table
        with options, recommendation, fallback, and the blocking day, ending with
        an unanswered DECISION REQUIRED block.
- id: m2
  title: 'Playable: a pure-Dart engine, a bot that proves levels, and a game you can
    touch'
  days:
  - 3
  - 4
  - 5
  - 6
  - 7
  tasks:
  - id: t5
    day: 3
    kind: feature
    title: 'Engine core: closed-loop travel, tap reversal, obstacles, deterministic
      headless simulation'
    acceptance_criteria:
    - '`dart run tool/play.dart --level <file> --taps 120,340` prints a terminal outcome
      of exactly one of COMPLETED, COLLIDED, or TIMEOUT, and exits 0'
    - Running the same level with the same tap ticks twice produces byte-identical
      state traces (asserted by a determinism test)
    - A tap at tick N reverses the dot's direction of travel from tick N+1 onward,
      and the dot's position after 2N ticks with a tap at N equals its position at
      tick 0 (asserted by a unit test)
    - A collision is reported when the dot and an obstacle occupy overlapping arc
      positions on the same tick, and not otherwise (asserted by unit tests for both
      cases)
    - The engine purity guard from day 1 remains green
    depends_on:
    - t2
    surfaces:
    - engine
    - tooling
    estimate_minutes: 120
    risk: high
    needs_human: false
    proof:
      kind: command_output
      expect: 'Terminal output of two `dart run tool/play.dart` invocations on the
        same level: one tap script printing COMPLETED with a tick count, another printing
        COLLIDED with the tick and arc position of the collision.'
  - id: t6
    day: 4
    kind: feature
    title: 'Levels as data: JSON format, loader, and validator'
    acceptance_criteria:
    - Adding a new file to `assets/levels/` makes it playable by `dart run tool/play.dart`
      with zero changes to any `.dart` file and no new class (demonstrated by adding
      and then removing a throwaway level in the diff or a test)
    - '`dart run tool/validate_levels.dart` exits 0 for all shipped levels and exits
      non-zero with the file name and field name for a level missing a required field
      or holding an out-of-range value'
    - '`docs/level-format.md` documents every field, its type, its range, and its
      effect on play'
    - '`pubspec.yaml` includes `assets/levels/` as a directory entry, not a per-file
      list'
    depends_on:
    - t5
    surfaces:
    - engine
    - assets
    - docs
    estimate_minutes: 100
    risk: medium
    needs_human: false
    proof:
      kind: command_output
      expect: Terminal output showing validate_levels passing on the shipped set,
        then failing on a deliberately broken level with a message naming the file
        and the offending field, then play.dart running a level added seconds earlier
        with no rebuild of Dart sources.
  - id: t7
    day: 5
    kind: feature
    title: Headless verifier bot and the CI gate that blocks unbeatable levels
    acceptance_criteria:
    - '`dart run tool/verify_levels.dart` prints one PASS/FAIL line per level with
      the winning tap sequence for each PASS, and exits non-zero if any level is FAIL'
    - CI runs the verifier on every push and turns red when a deliberately unbeatable
      level file is committed
    - The search budget (max ticks and max branches per level) is documented and enforced,
      and the full run over all shipped levels finishes in under 60 seconds on CI
    - Each PASS writes its winning tap sequence to `test/fixtures/solutions/<level>.json`,
      and a replay test re-runs those recorded sequences and asserts they still complete
    depends_on:
    - t5
    - t6
    surfaces:
    - engine
    - tooling
    - ci
    estimate_minutes: 110
    risk: high
    needs_human: false
    proof:
      kind: command_output
      expect: CI log of verify_levels showing a PASS line per level with tick counts
        and total wall-clock under 60s, plus a red CI run on a branch with a level
        whose obstacle spacing makes it unbeatable, printing FAIL and the exhausted
        budget.
  - id: t8
    day: 6
    kind: feature
    title: 'First playable: Flame renders the loop, the dot, and obstacles; a tap
      reverses'
    acceptance_criteria:
    - Launching the app and starting level 1 renders the closed loop, the dot travelling
      along it, and every obstacle from the level file, at their engine-reported positions
    - A single tap anywhere on the play area reverses the dot's direction, and no
      other touch gesture changes play state
    - The rendering layer reads state from the engine and never mutates it — `lib/ui/`
      contains no gameplay arithmetic, and the engine purity guard stays green
    - All colours, sizes, and animation durations on the play screen resolve to design-system
      tokens from day 2
    depends_on:
    - t5
    - t6
    - t3
    surfaces:
    - ui
    - app
    - engine
    estimate_minutes: 110
    risk: medium
    needs_human: false
    proof:
      kind: emulator_screenshot
      expect: 'Three emulator screenshots of level 1 in progress: dot mid-loop travelling
        clockwise, the same level after a tap with the dot travelling counter-clockwise,
        and a near-miss with an obstacle — loop, dot, and obstacles all clearly rendered
        in the provisional palette.'
  - id: t9
    day: 7
    kind: feature
    title: 'Run loop: death, level complete, progression through levels 1–3, and HUD'
    acceptance_criteria:
    - Colliding with an obstacle ends the run and shows a retry affordance; tapping
      it restarts the same level from tick 0 with no residual state from the previous
      attempt
    - Completing a level advances to the next one, and completing level 3 with no
      prior progress leaves the app on level 4
    - The HUD shows the current level number and survival progress, using design-system
      tokens only
    - Levels 1, 2, and 3 introduce the mechanic in sequence — level 1 has a single
      obstacle requiring one reversal, and each of levels 2 and 3 adds exactly one
      new demand — recorded in `docs/level-design.md`
    depends_on:
    - t8
    - t7
    surfaces:
    - ui
    - app
    - engine
    estimate_minutes: 100
    risk: medium
    needs_human: false
    proof:
      kind: emulator_screenshot
      expect: 'A four-shot sequence on the emulator: level 1 HUD showing ''LEVEL 1'',
        the death overlay with retry after a collision, the level-complete transition,
        and level 2 running — proving progression without leaving the app.'

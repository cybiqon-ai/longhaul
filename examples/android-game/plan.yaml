risk_flags:
- 'Day 5 is the plan''s single point of failure. If a bounded search cannot reliably
  find a winning tap sequence, ''every level verified completable'' stops being provable
  and days 8, 10 and 11 all stall. Mitigation is built into t7: each PASS records
  its winning tap sequence as a fixture, so the fallback is authored-solution replay
  rather than live search.'
- Days 8, 10 and 11 assume ten levels authored, tuned and bot-verified per day. This
  is the most aggressive assumption in the plan. If it slips, the valuable coherent
  subset is levels 1-20 across two loop shapes fully hand-tuned; levels 21-30 would
  ship as a parameter ramp over the third shape rather than individually tuned.
- Settings persistence and audio both want a package beyond Flutter and Flame, which
  the target reserves for the author. Day 2 (t4) parks the decision; if it is unanswered
  by day 9, t11 lands with platform-channel persistence and a silent sound port, so
  the toggle persists and is testable but nothing is audible until the dependency
  is approved.
- '''A mid-range device'' is undefined in the target. Day 12 (t15) measures cold start
  on a named emulator profile and any available physical device and records which
  was used; a slower reference device could invalidate the under-two-seconds claim.'
- The final palette (day 2) and the app icon (day 13) are the author's decisions.
  Both ship provisional and clearly labelled. If unanswered by day 13, the store screenshots
  and feature graphic will need re-exporting once the pick lands - roughly 30 minutes,
  chargeable to the day 14 buffer.
- Slack is one day in fourteen, not the two the ideal ratio wants. Day 14 is the only
  reserved buffer; days 12 and 13 are deliberately lighter. Any slip beyond one day
  comes out of levels 21-30 first.
- Day 10 assumes loop shape can be expressed parametrically in the level file. If
  the third shape needs a primitive the data format cannot express, t12 or t13 may
  have to extend the engine and re-issue docs/level-format.md, which would put the
  'levels are data, not code' constraint under pressure - flag it rather than adding
  a per-shape class.
- Day 6 is the first time engine timing meets a real render loop. If Flame's frame
  pacing and the engine's fixed-step simulation disagree, the on-device feel may diverge
  from what the bot verifies. t8 keeps the engine authoritative to contain this, but
  a visible mismatch would land on day 7 and eat buffer.

[project]
name = "longhaul-ai"
version = "0.0.1"
description = "Give it a target and a deadline. It ships a day's worth of work every day, and only wakes you when something needs a human."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cybiqon AI Solutions" }]
keywords = ["agent", "automation", "claude", "autonomous", "ci"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]

# One dependency, deliberately. plan.yaml needs a YAML parser; everything else
# — Telegram, the GitHub API, the dashboard server — is stdlib urllib and
# http.server. A tool that runs unattended for two weeks should have as little
# as possible that can break under a machine-level pip change.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
# The console script is `longhaul`; the distribution is `longhaul-ai` because
# PyPI `longhaul` is taken by an unrelated MLX fine-tuning CLI.
longhaul = "longhaul.cli:main"

[project.urls]
Homepage = "https://github.com/cybiqon-ai/longhaul"
Issues = "https://github.com/cybiqon-ai/longhaul/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longhaul"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff is used across the Cybiqon tree but has never been configured anywhere.
# This is the first config; treat it as the house default.
[tool.ruff]
line-length = 100
target-version = "py311"
# tools/ is vendored Apache-2.0 code from another project. Don't reformat it —
# keeping it byte-identical to upstream is what makes the vendoring honest.
exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH"]
